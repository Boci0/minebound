[package]
name = "minebound"
default-run = "minebound"
version = "1.7.1"
edition = "2021"
license = "MIT"

[dependencies]
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
# the vendored copy below, named directly so the game can muffle the mix
quad-snd = "0.2.8"

# quad-snd with sound decoding moved off the game thread, and music streamed instead of decoded whole (see vendor/quad-snd/src/mixer.rs, "minebound patch")
[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
# macroquad sending each font atlas to the GPU once a frame (changed rows only), not after every new glyph, and packing
# glyphs by size so an atlas stays small (vendor/macroquad/src/text/atlas.rs)
macroquad = { path = "vendor/macroquad" }

# optimise dependencies in debug builds too: audio decoding is otherwise many times slower
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# text-mode play for playtesting (src/bin/play.rs); it reuses the rules modules, so their tests already run with the game
[[bin]]
name = "play"
path = "src/bin/play.rs"
test = false
